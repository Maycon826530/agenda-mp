spring.application.name=agenda-mp
server.port=8080

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.data-source-properties.encrypt=true
spring.datasource.hikari.data-source-properties.trustServerCertificate=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://pharmalife-81306.web.app,https://pharmalife-81306.firebaseapp.com}
